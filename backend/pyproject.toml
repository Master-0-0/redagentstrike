[project]
name = "workbench"
version = "0.1.0"
description = "macOS MVP control plane + HTTP network timeline"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "duckdb>=1.1",
  "httpx>=0.27",
  "pydantic>=2.0",
  "certifi",
  "PyYAML>=6.0",
  "playwright>=1.49,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
workbench = "workbench.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
